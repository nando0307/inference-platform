[package]
name = "rust-control-plane"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
num-bigint = { version = "0.4", features = ["serde"] }
unicode-ident = "1"
unicode-normalization = "0.1"
